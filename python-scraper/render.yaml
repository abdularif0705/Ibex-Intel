# Render.com Blueprint Configuration
# This file automates deployment of the Python scraper service

services:
  # Main Python Scraper Service
  - type: web
    name: signalstream-python-scraper
    runtime: python
    env: python
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio
    plan: starter   # Free tier available, or use 'starter' ($7/mo)
    
    # Build configuration
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 main:app
    
    # Root directory (relative to repo root)
    rootDir: python-scraper
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Auto-deploy on push to main branch
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: PORT
        value: 8080
      
      - key: ALLOWED_ORIGINS
        value: "*"  # Change to your domain in production: https://yourapp.com
      
      - key: PYTHON_ENV
        value: production
      
      - key: WORKERS
        value: 1
    
    # Scaling configuration
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 80

